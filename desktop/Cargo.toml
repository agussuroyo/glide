[package]
name = "glide"
version = "0.1.0"
edition = "2024"

[dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
mdns-sd = "0.21.6"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "std"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSURL", "NSString"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
