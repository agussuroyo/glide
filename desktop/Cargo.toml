[package]
name = "glide"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
hmac = "0.13.0"
mdns-sd = "0.21.6"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSBox", "NSButton", "NSCell", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSImageView", "NSMenu", "NSMenuItem", "NSPanel", "NSParagraphStyle", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation", "std"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSURL", "NSString", "NSTimer", "NSDate", "NSThread", "block2", "NSData"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
qrcode = { version = "0.14.1", default-features = false }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
